name: Mettre à jour les pronostics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "30 6 * * *"

permissions:
  contents: read

jobs:
  update-pronos:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Valider les résultats
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *' || github.event.schedule == '30 6 * * *'
        run: python generate_pronos.py --update-results
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      - name: Générer les pronostics
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 6 * * *'
        run: python generate_pronos.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
